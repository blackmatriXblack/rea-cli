<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="REA CLI workflow">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070d18"/><stop offset="1" stop-color="#0d1a2c"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2f4a6b"/>
    </marker>
  </defs>
  <rect width="1200" height="400" fill="url(#bg)"/>
  <g font-family="Segoe UI, Inter, Arial, sans-serif">
    <text x="60" y="58" font-size="26" font-weight="700" fill="#eef6ff">One pass, five stages</text>
    <text x="60" y="86" font-size="14" fill="#8fa6c4">Every stage prints a timestamp and lands in the evidence.</text>

    <g>
      <g transform="translate(60,130)">
        <rect width="196" height="168" rx="14" fill="#101c2e" stroke="#27415f"/>
        <path d="M34 40h34l14 16h30v44H34z" fill="none" stroke="#7dd3fc" stroke-width="3" stroke-linejoin="round"/>
        <text x="24" y="130" font-size="15" font-weight="600" fill="#e6f2ff">Target</text>
        <text x="24" y="150" font-size="12" fill="#7f96b5">file, folder or archive</text>
      </g>
      <line x1="262" y1="214" x2="300" y2="214" stroke="#2f4a6b" stroke-width="2" marker-end="url(#arrow)"/>

      <g transform="translate(306,130)">
        <rect width="196" height="168" rx="14" fill="#101c2e" stroke="#27415f"/>
        <circle cx="62" cy="66" r="22" fill="none" stroke="#fbbf24" stroke-width="3"/>
        <line x1="78" y1="82" x2="94" y2="98" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
        <text x="24" y="130" font-size="15" font-weight="600" fill="#e6f2ff">Detect</text>
        <text x="24" y="150" font-size="12" fill="#7f96b5">content, not extension</text>
      </g>
      <line x1="508" y1="214" x2="546" y2="214" stroke="#2f4a6b" stroke-width="2" marker-end="url(#arrow)"/>

      <g transform="translate(552,130)">
        <rect width="196" height="168" rx="14" fill="#101c2e" stroke="#27415f"/>
        <circle cx="62" cy="66" r="20" fill="none" stroke="#2dd4bf" stroke-width="3"/>
        <circle cx="62" cy="66" r="8" fill="none" stroke="#2dd4bf" stroke-width="3"/>
        <g stroke="#2dd4bf" stroke-width="3" stroke-linecap="round">
          <line x1="62" y1="38" x2="62" y2="46"/><line x1="62" y1="86" x2="62" y2="94"/>
          <line x1="34" y1="66" x2="42" y2="66"/><line x1="82" y1="66" x2="90" y2="66"/>
          <line x1="42" y1="46" x2="48" y2="52"/><line x1="76" y1="80" x2="82" y2="86"/>
          <line x1="42" y1="86" x2="48" y2="80"/><line x1="76" y1="52" x2="82" y2="46"/>
        </g>
        <text x="24" y="130" font-size="15" font-weight="600" fill="#e6f2ff">Reader</text>
        <text x="24" y="150" font-size="12" fill="#7f96b5">facts, code, source</text>
      </g>
      <line x1="754" y1="214" x2="792" y2="214" stroke="#2f4a6b" stroke-width="2" marker-end="url(#arrow)"/>

      <g transform="translate(798,130)">
        <rect width="196" height="168" rx="14" fill="#101c2e" stroke="#27415f"/>
        <path d="M46 42h44l16 16v52H46z" fill="none" stroke="#c4b5fd" stroke-width="3" stroke-linejoin="round"/>
        <path d="M58 72h32M58 84h32M58 96h20" stroke="#c4b5fd" stroke-width="3" stroke-linecap="round"/>
        <text x="24" y="130" font-size="15" font-weight="600" fill="#e6f2ff">Evidence</text>
        <text x="24" y="150" font-size="12" fill="#7f96b5">coverage, limits, trace</text>
      </g>
      <line x1="1000" y1="214" x2="1038" y2="214" stroke="#2f4a6b" stroke-width="2" marker-end="url(#arrow)"/>

      <g transform="translate(1044,130)">
        <rect width="196" height="168" rx="14" fill="#101c2e" stroke="#27415f"/>
        <path d="M48 46h44l14 14h42v58H48z" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linejoin="round"/>
        <text x="24" y="130" font-size="15" font-weight="600" fill="#e6f2ff">Output</text>
        <text x="24" y="150" font-size="12" fill="#7f96b5">report, JSON, sources</text>
      </g>
    </g>

    <g transform="translate(60,330)">
      <rect width="1080" height="34" rx="17" fill="#0e1b2c" stroke="#233a57"/>
      <circle cx="22" cy="17" r="5" fill="#2dd4bf"/>
      <text x="40" y="22" font-size="12.5" fill="#a9c2e0" font-family="Cascadia Code, Consolas, monospace">no network · remote paths refused · external engines only when already installed</text>
    </g>
  </g>
</svg>
