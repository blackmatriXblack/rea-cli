<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="Formats supported by REA CLI">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070d18"/><stop offset="1" stop-color="#0c1728"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111d30"/><stop offset="1" stop-color="#0c1626"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="560" fill="url(#bg)"/>
  <g font-family="Segoe UI, Inter, Arial, sans-serif">
    <text x="60" y="58" font-size="26" font-weight="700" fill="#eef6ff">29 built-in readers</text>
    <text x="60" y="86" font-size="14" fill="#8fa6c4">Detection is content-first; every reader records its coverage and limits.</text>

    <g>
      <g transform="translate(60,112)">
        <rect width="250" height="164" rx="14" fill="url(#card)" stroke="#25405e"/>
        <rect x="28" y="26" width="46" height="46" rx="10" fill="none" stroke="#34d399" stroke-width="3"/>
        <path d="M40 46h22M40 56h22" stroke="#34d399" stroke-width="3" stroke-linecap="round"/>
        <text x="92" y="46" font-size="16" font-weight="700" fill="#e9f3ff">APK</text>
        <text x="92" y="64" font-size="11" fill="#7f96b5">Android package</text>
        <text x="28" y="112" font-size="12" fill="#a9c2e0">manifest · smali · Java</text>
        <text x="28" y="134" font-size="11" fill="#5f7699">binary XML, dex, native libs</text>
      </g>

      <g transform="translate(340,112)">
        <rect width="250" height="164" rx="14" fill="url(#card)" stroke="#25405e"/>
        <path d="M30 34h44v40H30z" fill="none" stroke="#60a5fa" stroke-width="3"/>
        <path d="M42 46l10 8-10 8M58 62h12" fill="none" stroke="#60a5fa" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="92" y="46" font-size="16" font-weight="700" fill="#e9f3ff">.NET</text>
        <text x="92" y="64" font-size="11" fill="#7f96b5">managed assembly</text>
        <text x="28" y="112" font-size="12" fill="#a9c2e0">metadata · CIL · C#</text>
        <text x="28" y="134" font-size="11" fill="#5f7699">types, refs, method bodies</text>
      </g>

      <g transform="translate(620,112)">
        <rect width="250" height="164" rx="14" fill="url(#card)" stroke="#25405e"/>
        <path d="M32 62h44v-8a6 6 0 0 0-6-6H48v-6h-8v6H38a6 6 0 0 0-6 6z" fill="none" stroke="#fb923c" stroke-width="3" stroke-linejoin="round"/>
        <path d="M40 62v10h28V62" fill="none" stroke="#fb923c" stroke-width="3" stroke-linejoin="round"/>
        <text x="92" y="46" font-size="16" font-weight="700" fill="#e9f3ff">Java</text>
        <text x="92" y="64" font-size="11" fill="#7f96b5">class / jar</text>
        <text x="28" y="112" font-size="12" fill="#a9c2e0">pool · bytecode · source</text>
        <text x="28" y="134" font-size="11" fill="#5f7699">javap listing + .java</text>
      </g>

      <g transform="translate(900,112)">
        <rect width="250" height="164" rx="14" fill="url(#card)" stroke="#25405e"/>
        <path d="M54 30l24 14v28L54 86 30 72V44z" fill="none" stroke="#2dd4bf" stroke-width="3" stroke-linejoin="round"/>
        <path d="M54 30v28l24 14M54 58L30 72" fill="none" stroke="#2dd4bf" stroke-width="2" opacity="0.6"/>
        <text x="104" y="46" font-size="16" font-weight="700" fill="#e9f3ff">DEX</text>
        <text x="104" y="64" font-size="11" fill="#7f96b5">Dalvik executable</text>
        <text x="28" y="112" font-size="12" fill="#a9c2e0">classes · smali · Java</text>
        <text x="28" y="134" font-size="11" fill="#5f7699">register lifting</text>
      </g>

      <g transform="translate(60,308)">
        <rect width="250" height="164" rx="14" fill="url(#card)" stroke="#25405e"/>
        <path d="M52 30l24 14v28L52 86 28 72V44z" fill="none" stroke="#c084fc" stroke-width="3" stroke-linejoin="round"/>
        <text x="100" y="46" font-size="16" font-weight="700" fill="#e9f3ff">WASM</text>
        <text x="100" y="64" font-size="11" fill="#7f96b5">WebAssembly</text>
        <text x="28" y="112" font-size="12" fill="#a9c2e0">sections · imports · WAT</text>
        <text x="28" y="134" font-size="11" fill="#5f7699">types, memories, globals</text>
      </g>

      <g transform="translate(340,308)">
        <rect width="250" height="164" rx="14" fill="url(#card)" stroke="#25405e"/>
        <rect x="30" y="30" width="44" height="44" rx="6" fill="none" stroke="#94a3b8" stroke-width="3"/>
        <path d="M30 44h44M44 30v44" stroke="#94a3b8" stroke-width="2" opacity="0.7"/>
        <text x="92" y="46" font-size="15" font-weight="700" fill="#e9f3ff">PE · ELF</text>
        <text x="92" y="64" font-size="11" fill="#7f96b5">Mach-O too</text>
        <text x="28" y="112" font-size="12" fill="#a9c2e0">imports · symbols · asm</text>
        <text x="28" y="134" font-size="11" fill="#5f7699">sections, notes, mitigations</text>
      </g>

      <g transform="translate(620,308)">
        <rect width="250" height="164" rx="14" fill="url(#card)" stroke="#25405e"/>
        <path d="M38 34c20-12 40 12 58 0M38 58c20-12 40 12 58 0M38 82c20-12 40 12 58 0" fill="none" stroke="#facc15" stroke-width="3" stroke-linecap="round"/>
        <text x="112" y="46" font-size="16" font-weight="700" fill="#e9f3ff">Python</text>
        <text x="112" y="64" font-size="11" fill="#7f96b5">.pyc bytecode</text>
        <text x="28" y="112" font-size="12" fill="#a9c2e0">marshal · bytecode · .py</text>
        <text x="28" y="134" font-size="11" fill="#5f7699">code objects, constants</text>
      </g>

      <g transform="translate(900,308)">
        <rect width="250" height="164" rx="14" fill="url(#card)" stroke="#25405e"/>
        <path d="M36 40c-8 14-8 44 0 58M64 40c8 14 8 44 0 58" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
        <text x="84" y="46" font-size="16" font-weight="700" fill="#e9f3ff">JS · ASAR</text>
        <text x="84" y="64" font-size="11" fill="#7f96b5">Electron apps</text>
        <text x="28" y="112" font-size="12" fill="#a9c2e0">bundles · maps · imports</text>
        <text x="28" y="134" font-size="11" fill="#5f7699">URLs, markers, re-indent</text>
      </g>
    </g>

    <text x="60" y="522" font-size="12" fill="#6f88a8">Also: tar, gzip, bzip2, xz, 7z, rar, zip, jar, SQLite, BEAM, GGUF, plist, JSON, Godot PCK, UnityFS, AXML, text and unknown bytes.</text>
  </g>
</svg>
