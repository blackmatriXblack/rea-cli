<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-label="REA CLI hero">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070d18"/>
      <stop offset="0.55" stop-color="#0b1424"/>
      <stop offset="1" stop-color="#0f1e33"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M 34 0 L 0 0 0 34" fill="none" stroke="#1b2b45" stroke-width="1" opacity="0.55"/>
    </pattern>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101b2d"/>
      <stop offset="1" stop-color="#0b1524"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="470" fill="url(#bg)"/>
  <rect width="1200" height="470" fill="url(#grid)"/>
  <circle cx="1030" cy="80" r="150" fill="#2dd4bf" opacity="0.10" filter="url(#glow)"/>
  <circle cx="150" cy="430" r="120" fill="#38bdf8" opacity="0.08" filter="url(#glow)"/>

  <g font-family="Segoe UI, Inter, Arial, sans-serif">
    <g transform="translate(72,66)">
      <rect width="262" height="32" rx="16" fill="#0f2a2a" stroke="#1f4f4a"/>
      <circle cx="19" cy="16" r="5" fill="#2dd4bf"/>
      <text x="34" y="21" font-size="12" fill="#7ef0dd" letter-spacing="2.2">OFFLINE · NO DOWNLOADS</text>
    </g>

    <text x="70" y="196" font-size="78" font-weight="700" fill="#f2f8ff" letter-spacing="-1.5">REA CLI</text>
    <text x="72" y="234" font-size="17" fill="#a9bcd8">Reverse-engineer binaries, apps and bytecode from one terminal.</text>

    <g transform="translate(72,266)" font-size="13" font-weight="600">
      <g>
        <rect width="142" height="34" rx="10" fill="#0e1b2c" stroke="#24405f"/>
        <text x="15" y="22" fill="#cfe3ff">binary analysis</text>
      </g>
      <g transform="translate(150,0)">
        <rect width="152" height="34" rx="10" fill="#0e1b2c" stroke="#24405f"/>
        <text x="15" y="22" fill="#cfe3ff">source recovery</text>
      </g>
      <g transform="translate(310,0)">
        <rect width="132" height="34" rx="10" fill="#0e1b2c" stroke="#24405f"/>
        <text x="15" y="22" fill="#cfe3ff">evidence trail</text>
      </g>
      <g transform="translate(0,44)">
        <rect width="158" height="34" rx="10" fill="#0e1b2c" stroke="#24405f"/>
        <text x="15" y="22" fill="#cfe3ff">interactive shell</text>
      </g>
      <g transform="translate(166,44)">
        <rect width="150" height="34" rx="10" fill="#0e1b2c" stroke="#24405f"/>
        <text x="15" y="22" fill="#cfe3ff">local engines only</text>
      </g>
    </g>

    <g transform="translate(600,66)">
      <rect width="560" height="340" rx="16" fill="url(#panel)" stroke="#26405f"/>
      <path d="M0 16a16 16 0 0 1 16-16h528a16 16 0 0 1 16 16v24H0z" fill="#0f1b2c"/>
      <circle cx="20" cy="20" r="5" fill="#ff6b6b"/>
      <circle cx="40" cy="20" r="5" fill="#fbbf24"/>
      <circle cx="60" cy="20" r="5" fill="#34d399"/>
      <text x="82" y="25" font-family="Cascadia Code, Consolas, monospace" font-size="11.5" fill="#7f93b3">rea — terminal</text>

      <g font-family="Cascadia Code, Consolas, monospace" font-size="12.5">
        <text x="20" y="76" fill="#fbbf24">[ 0.003s]</text><text x="102" y="76" fill="#cfe3ff">detected Android package (APK)</text>
        <text x="20" y="100" fill="#fbbf24">[ 0.006s]</text><text x="102" y="100" fill="#cfe3ff">zip: 5 entries, 1 dex, 1 native library</text>
        <text x="20" y="124" fill="#fbbf24">[ 0.008s]</text><text x="102" y="124" fill="#cfe3ff">manifest decoded: components + permissions</text>
        <text x="20" y="148" fill="#fbbf24">[ 0.009s]</text><text x="102" y="148" fill="#cfe3ff">lifting Java method bodies from registers</text>
        <text x="20" y="172" fill="#fbbf24">[ 0.052s]</text><text x="102" y="172" fill="#cfe3ff">reader finished: 3 artifacts, 2 limitations</text>
        <text x="20" y="212" fill="#2dd4bf">source files: 1</text>
        <text x="36" y="236" fill="#93c5fd">C:\out\app\dex\java\demo\Hello.java</text>
        <text x="20" y="272" fill="#94a3b8">rea&gt;</text>
        <rect x="66" y="260" width="8" height="15" fill="#2dd4bf"/>
      </g>

      <g transform="translate(20,300)" font-family="Cascadia Code, Consolas, monospace" font-size="11">
        <rect width="118" height="26" rx="8" fill="#0d1a2b" stroke="#233a57"/>
        <text x="12" y="17" fill="#7ef0dd">.java</text>
        <rect x="128" width="118" height="26" rx="8" fill="#0d1a2b" stroke="#233a57"/>
        <text x="140" y="17" fill="#fbbf24">.smali</text>
        <rect x="256" width="118" height="26" rx="8" fill="#0d1a2b" stroke="#233a57"/>
        <text x="268" y="17" fill="#93c5fd">.json</text>
        <rect x="384" width="118" height="26" rx="8" fill="#0d1a2b" stroke="#233a57"/>
        <text x="396" y="17" fill="#c4b5fd">.il</text>
      </g>
    </g>
  </g>
</svg>
