<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-label="Common command recipes">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070d18"/><stop offset="1" stop-color="#0c1728"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101d30"/><stop offset="1" stop-color="#0b1524"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="520" fill="url(#bg)"/>
  <g font-family="Segoe UI, Inter, Arial, sans-serif">
    <text x="50" y="48" font-size="23" font-weight="700" fill="#eef6ff">Recipes</text>
    <text x="50" y="74" font-size="13" fill="#8fa6c4">Common jobs, copy-ready. Every command accepts --json and --no-pause.</text>

    <g transform="translate(50,100)">
      <rect width="540" height="170" rx="14" fill="url(#card)" stroke="#25405e"/>
      <text x="20" y="30" font-size="13" font-weight="700" fill="#2dd4bf">Batch a folder</text>
      <g font-family="Cascadia Code, Consolas, monospace" font-size="11.5">
        <text x="20" y="60" fill="#cfe3ff">Get-ChildItem C:\samples -File | ForEach-Object {</text>
        <text x="36" y="82" fill="#cfe3ff">rea analyze $_.FullName --no-pause `</text>
        <text x="52" y="104" fill="#cfe3ff">--out ("C:\out\" + $_.BaseName) --json | Out-Null</text>
        <text x="20" y="126" fill="#cfe3ff">}</text>
      </g>
    </g>

    <g transform="translate(610,100)">
      <rect width="540" height="170" rx="14" fill="url(#card)" stroke="#25405e"/>
      <text x="20" y="30" font-size="13" font-weight="700" fill="#fbbf24">Compare two builds</text>
      <g font-family="Cascadia Code, Consolas, monospace" font-size="11.5">
        <text x="20" y="62" fill="#cfe3ff">rea compare C:\v1\App.dll C:\v2\App.dll</text>
        <text x="20" y="88" fill="#5f7699">same bytes, formats, per-field summary diff</text>
        <text x="20" y="120" fill="#cfe3ff">rea compare a.dll b.dll --json > diff.json</text>
      </g>
    </g>

    <g transform="translate(50,300)">
      <rect width="540" height="170" rx="14" fill="url(#card)" stroke="#25405e"/>
      <text x="20" y="30" font-size="13" font-weight="700" fill="#c4b5fd">Source only</text>
      <g font-family="Cascadia Code, Consolas, monospace" font-size="11.5">
        <text x="20" y="62" fill="#cfe3ff">rea source C:\samples\app.apk `</text>
        <text x="36" y="84" fill="#cfe3ff">--out D:\src\app --open</text>
        <text x="20" y="116" fill="#5f7699">prints SOURCE-INDEX.txt paths, opens the folder</text>
      </g>
    </g>

    <g transform="translate(610,300)">
      <rect width="540" height="170" rx="14" fill="url(#card)" stroke="#25405e"/>
      <text x="20" y="30" font-size="13" font-weight="700" fill="#7dd3fc">Keep evidence for later</text>
      <g font-family="Cascadia Code, Consolas, monospace" font-size="11.5">
        <text x="20" y="62" fill="#cfe3ff">rea analyze app.apk --out D:\review\app --timings</text>
        <text x="20" y="88" fill="#cfe3ff">rea evidence D:\review\app\evidence.json</text>
        <text x="20" y="120" fill="#5f7699">re-read facts, coverage, limits and sources offline</text>
      </g>
    </g>
  </g>
</svg>
