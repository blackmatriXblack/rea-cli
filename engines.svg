<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Built-in readers and optional local engines">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070d18"/><stop offset="1" stop-color="#0c1728"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101d30"/><stop offset="1" stop-color="#0b1524"/>
    </linearGradient>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2f4a6b"/>
    </marker>
  </defs>
  <rect width="1200" height="400" fill="url(#bg)"/>
  <g font-family="Segoe UI, Inter, Arial, sans-serif">
    <text x="50" y="52" font-size="23" font-weight="700" fill="#eef6ff">Built-in first, engines second</text>
    <text x="50" y="78" font-size="13" fill="#8fa6c4">Readers always work. A local engine is an extra oracle, never a dependency.</text>

    <g transform="translate(50,116)">
      <rect width="380" height="220" rx="16" fill="url(#panel)" stroke="#2a4a6a"/>
      <text x="22" y="34" font-size="13" font-weight="700" fill="#7ef0dd">BUILT-IN READERS</text>
      <g font-family="Cascadia Code, Consolas, monospace" font-size="12">
        <rect x="22" y="52" width="150" height="30" rx="8" fill="#0b1626" stroke="#223a57"/>
        <text x="36" y="72" fill="#cfe3ff">metadata / IL</text>
        <rect x="22" y="92" width="150" height="30" rx="8" fill="#0b1626" stroke="#223a57"/>
        <text x="36" y="112" fill="#cfe3ff">smali / registers</text>
        <rect x="22" y="132" width="150" height="30" rx="8" fill="#0b1626" stroke="#223a57"/>
        <text x="36" y="152" fill="#cfe3ff">sections / symbols</text>
        <rect x="22" y="172" width="150" height="30" rx="8" fill="#0b1626" stroke="#223a57"/>
        <text x="36" y="192" fill="#cfe3ff">strings / entropy</text>

        <rect x="196" y="52" width="150" height="30" rx="8" fill="#0b1626" stroke="#223a57"/>
        <text x="210" y="72" fill="#cfe3ff">marshal / bytecode</text>
        <rect x="196" y="92" width="150" height="30" rx="8" fill="#0b1626" stroke="#223a57"/>
        <text x="210" y="112" fill="#cfe3ff">binary XML</text>
        <rect x="196" y="132" width="150" height="30" rx="8" fill="#0b1626" stroke="#223a57"/>
        <text x="210" y="152" fill="#cfe3ff">archives</text>
        <rect x="196" y="172" width="150" height="30" rx="8" fill="#0b1626" stroke="#223a57"/>
        <text x="210" y="192" fill="#cfe3ff">schema / evidence</text>
      </g>
    </g>

    <line x1="446" y1="226" x2="518" y2="226" stroke="#2f4a6b" stroke-width="2" marker-end="url(#arw)"/>
    <text x="452" y="210" font-size="11" fill="#7f96b5" font-family="Cascadia Code, Consolas, monospace">only if installed</text>

    <g transform="translate(528,116)">
      <rect width="250" height="220" rx="16" fill="url(#panel)" stroke="#2a4a6a"/>
      <text x="20" y="34" font-size="13" font-weight="700" fill="#fbbf24">LOCAL ENGINES</text>
      <g font-family="Cascadia Code, Consolas, monospace" font-size="12">
        <text x="20" y="64" fill="#cfe3ff">objdump</text><text x="150" y="64" fill="#5f7699">asm</text>
        <text x="20" y="90" fill="#cfe3ff">llvm-objdump</text><text x="150" y="90" fill="#5f7699">asm</text>
        <text x="20" y="116" fill="#cfe3ff">ilspycmd</text><text x="150" y="116" fill="#5f7699">C#</text>
        <text x="20" y="142" fill="#cfe3ff">jadx</text><text x="150" y="142" fill="#5f7699">Java</text>
        <text x="20" y="168" fill="#cfe3ff">7z</text><text x="150" y="168" fill="#5f7699">list</text>
        <text x="20" y="194" fill="#5f7699">javap, monodis, rizin, upx ...</text>
      </g>
    </g>

    <g transform="translate(820,116)">
      <rect width="330" height="220" rx="16" fill="#0e1b2c" stroke="#233a57"/>
      <text x="20" y="34" font-size="13" font-weight="700" fill="#f87171">NEVER DOWNLOADED</text>
      <g font-family="Cascadia Code, Consolas, monospace" font-size="12">
        <text x="20" y="66" fill="#cfe3ff">rea doctor</text>
        <text x="20" y="90" fill="#5f7699">  lists found engines + paths</text>
        <text x="20" y="114" fill="#cfe3ff">rea doctor --json</text>
        <text x="20" y="138" fill="#5f7699">  machine-readable inventory</text>
        <text x="20" y="162" fill="#cfe3ff">--no-engines</text>
        <text x="20" y="186" fill="#5f7699">  skip delegation entirely</text>
        <text x="20" y="210" fill="#2dd4bf">downloads: refused</text>
      </g>
    </g>
  </g>
</svg>
