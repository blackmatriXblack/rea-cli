<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-label="Interactive shell session">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070d18"/><stop offset="1" stop-color="#0c1728"/>
    </linearGradient>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f1b2d"/><stop offset="1" stop-color="#0a1422"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="640" fill="url(#bg)"/>
  <g font-family="Segoe UI, Inter, Arial, sans-serif">
    <text x="60" y="44" font-size="22" font-weight="700" fill="#eef6ff">Interactive shell</text>
    <text x="60" y="68" font-size="13" fill="#8fa6c4">The window stays open: analyze, inspect, list sources, search strings, print the report.</text>

    <g transform="translate(60,92)">
      <rect width="1080" height="500" rx="14" fill="url(#win)" stroke="#26405f"/>
      <path d="M0 14a14 14 0 0 1 14-14h1052a14 14 0 0 1 14 14v28H0z" fill="#0f1b2c"/>
      <circle cx="22" cy="21" r="5.5" fill="#ff6b6b"/>
      <circle cx="44" cy="21" r="5.5" fill="#fbbf24"/>
      <circle cx="66" cy="21" r="5.5" fill="#34d399"/>
      <text x="92" y="26" font-family="Cascadia Code, Consolas, monospace" font-size="12" fill="#7f93b3">rea shell — C:\samples</text>

      <g font-family="Cascadia Code, Consolas, monospace" font-size="12.5">
        <text x="26" y="80" fill="#2dd4bf">REA CLI (offline) - interactive shell</text>
        <text x="26" y="102" fill="#7f96b5">downloads: refused   engines: jadx</text>
        <text x="26" y="124" fill="#5f7699">Type 'help' for commands, 'quit' to exit.</text>

        <text x="26" y="160" fill="#2dd4bf">rea&gt;</text><text x="74" y="160" fill="#e6f2ff">open C:\samples\app.apk</text>
        <text x="26" y="184" fill="#cfe3ff">format      Android package (APK)</text>
        <text x="26" y="206" fill="#cfe3ff">dex_classes 312</text>
        <text x="26" y="228" fill="#cfe3ff">artifacts   315 (48.2 MiB)</text>
        <text x="26" y="250" fill="#2dd4bf">source      312 file(s) - type 'source' to list them</text>
        <text x="26" y="272" fill="#cfe3ff">output      C:\out\app</text>

        <text x="26" y="308" fill="#2dd4bf">rea&gt;</text><text x="74" y="308" fill="#e6f2ff">source</text>
        <text x="26" y="332" fill="#cfe3ff">source files: 312</text>
        <text x="42" y="354" fill="#93c5fd">C:\out\app\dex\java\com\example\MainActivity.java</text>
        <text x="42" y="376" fill="#93c5fd">C:\out\app\dex\java\com\example\net\ApiClient.java</text>

        <text x="26" y="412" fill="#2dd4bf">rea&gt;</text><text x="74" y="412" fill="#e6f2ff">strings https?</text>
        <text x="26" y="436" fill="#a9c2e0">0x000a41c  https://api.example.com/v1/items</text>
        <text x="26" y="458" fill="#a9c2e0">0x00118ce  https://cdn.example.com/app.js</text>

        <text x="26" y="494" fill="#2dd4bf">rea&gt;</text>
        <rect x="74" y="482" width="8" height="15" fill="#2dd4bf"/>
      </g>
    </g>
  </g>
</svg>
